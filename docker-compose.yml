version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: disease_surveillance_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-disease_surveillance}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disease_surveillance_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_NAME=${POSTGRES_DB:-disease_surveillance}
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - surveillance-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: disease_surveillance_ai
    restart: always
    ports:
      - "8000:8000"
    networks:
      - surveillance-network

  flower-server:
    build:
      context: ./flower-server
      dockerfile: Dockerfile
    container_name: disease_surveillance_flower_server
    restart: always
    ports:
      - "8080:8080"
    networks:
      - surveillance-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disease_surveillance_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - surveillance-network

  flower-client-a:
    build:
      context: ./flower-clients
      dockerfile: Dockerfile
    container_name: disease_surveillance_flower_client_a
    environment:
      - FLOWER_SERVER_HOST=flower-server
      - FLOWER_SERVER_PORT=8080
      - ZONE_ID=Zone_A
    depends_on:
      - flower-server
    networks:
      - surveillance-network

  flower-client-b:
    build:
      context: ./flower-clients
      dockerfile: Dockerfile
    container_name: disease_surveillance_flower_client_b
    environment:
      - FLOWER_SERVER_HOST=flower-server
      - FLOWER_SERVER_PORT=8080
      - ZONE_ID=Zone_B
    depends_on:
      - flower-server
    networks:
      - surveillance-network

  flower-client-c:
    build:
      context: ./flower-clients
      dockerfile: Dockerfile
    container_name: disease_surveillance_flower_client_c
    environment:
      - FLOWER_SERVER_HOST=flower-server
      - FLOWER_SERVER_PORT=8080
      - ZONE_ID=Zone_C
    depends_on:
      - flower-server
    networks:
      - surveillance-network

  flower-client-d:
    build:
      context: ./flower-clients
      dockerfile: Dockerfile
    container_name: disease_surveillance_flower_client_d
    environment:
      - FLOWER_SERVER_HOST=flower-server
      - FLOWER_SERVER_PORT=8080
      - ZONE_ID=Zone_D
    depends_on:
      - flower-server
    networks:
      - surveillance-network

  flower-client-e:
    build:
      context: ./flower-clients
      dockerfile: Dockerfile
    container_name: disease_surveillance_flower_client_e
    environment:
      - FLOWER_SERVER_HOST=flower-server
      - FLOWER_SERVER_PORT=8080
      - ZONE_ID=Zone_E
    depends_on:
      - flower-server
    networks:
      - surveillance-network

volumes:
  db-data:

networks:
  surveillance-network:
    driver: bridge
